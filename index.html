<!DOCTYPE html>
<html>
<head>
    <title>Online Grocery Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Online Grocery Store</h1>

    <div id="cart">
        🛒 Cart Items: <span id="cart-count">0</span>
        <br>
        💰 Total: ₹<span id="cart-total">0</span>
    </div>

    <div class="products">

        <div class="product">
            <h2>Apple</h2>
            <p>Price: ₹120</p>
            <button onclick="addToCart('Apple', 120)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h2>Milk</h2>
            <p>Price: ₹60</p>
            <button onclick="addToCart('Milk', 60)">
                Add to Cart
            </button>
        </div>

    </div>

    <div id="cart-section">
        <h2>Shopping Cart</h2>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <button id="checkout-button" onclick="showOrderForm()">
            Proceed to Checkout
        </button>
    </div>

    <div id="order-section">
        <h2>Place Your Order</h2>

        <form id="order-form" onsubmit="placeOrder(event)">

            <label for="customer-name">Customer Name</label>
            <input
                type="text"
                id="customer-name"
                placeholder="Enter your name"
                required
            >

            <label for="address">Delivery Address</label>
            <textarea
                id="address"
                placeholder="Enter your delivery address"
                required
            ></textarea>

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <button type="submit">
                Place Order
            </button>

        </form>
    </div>

    <div id="order-confirmation"></div>

    <script src="script.js"></script>
</body>
</html>
