<!DOCTYPE html>
<html>
<head>
    <title>Online Grocery Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Online Grocery Store</h1>

    <div class="product">
        <h2>Apple</h2>

        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
